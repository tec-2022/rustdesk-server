networks:
  rustdesk-net:
    external: false

services:
  hbbs:
    container_name: hbbs
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    image: ghcr.io/tec-2022/rustdesk-server:latest
    command: hbbs -r ${RUSTDESK_HOST:?Define RUSTDESK_HOST en el archivo .env}:21117
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    ports:
      - "21117:21117"
      - "21119:21119"
    image: ghcr.io/tec-2022/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    restart: unless-stopped
