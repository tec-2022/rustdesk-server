name: Publicar imagen propia

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/owned-image.yml"
      - ".dockerignore"
      - ".gitmodules"
      - "docker-owned/**"
      - "src/**"
      - "libs/hbb_common"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"

permissions:
  contents: read
  packages: write

concurrency:
  group: owned-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar nuestro codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar nuestra imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-owned/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rustdesk-server:latest
            ghcr.io/${{ github.repository_owner }}/rustdesk-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
