server {
    listen 80;
    listen [::]:80;
    server_name api.lvltechmx.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.lvltechmx.com;

    ssl_certificate /etc/letsencrypt/live/api.lvltechmx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lvltechmx.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2M;

    location / {
        proxy_pass http://100.112.196.81:21114;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
